<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>miniEMS Dashboard</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <h1>&#9889; miniEMS Dashboard</h1>
    <span class="version-badge">v{{ version }}</span>
  </header>
  <nav class="tab-nav">
    <a href="." class="tab-link active">Dashboard</a>
    <a href="settings" class="tab-link">Settings</a>
  </nav>
  <p class="refresh-hint">Auto-refreshes every 5 seconds</p>
  <div id="dashboard">Loading…</div>
  <footer>miniEMS v{{ version }} &middot; Home Assistant Add-on</footer>

  <script>
    async function refresh() {
      try {
        const r = await fetch('api/status');
        const d = await r.json();
        document.getElementById('dashboard').innerHTML = renderDashboard(d);
      } catch(e) { console.error(e); }
    }

    function fmt(v, dec = 1) {
      return v !== null && v !== undefined ? Number(v).toFixed(dec) : '–';
    }

    function fmtMode(m) {
      if (!m) return '';
      if (m.includes('PV'))      return 'mode-PV';
      if (m.includes('Grid'))    return 'mode-GRID';
      if (m.includes('Protect')) return 'mode-PROTECT';
      return 'mode-IDLE';
    }

    function renderDashboard(d) {
      const simBadge = (d.battery_control_active && d.battery_control_simulation)
        ? '<span class="sim-badge">SIM</span>' : '';
      return `
        <div class="mode-badge ${fmtMode(d.mode)}">${d.mode || 'Unknown'}${simBadge}</div>

        <div class="grid">
          <div class="card">
            <div class="label">PV Power</div>
            <div class="value">${fmt(d.pv_power_w, 0)}</div>
            <div class="unit">W</div>
          </div>
          <div class="card">
            <div class="label">Load Power</div>
            <div class="value">${fmt(d.load_power_w, 0)}</div>
            <div class="unit">W</div>
          </div>
          <div class="card">
            <div class="label">Grid Power</div>
            <div class="value">${fmt(d.grid_power_w, 0)}</div>
            <div class="unit">W</div>
          </div>
          <div class="card">
            <div class="label">Battery SoC</div>
            <div class="value">${fmt(d.battery_soc_pct, 0)}</div>
            <div class="unit">%</div>
          </div>
          <div class="card">
            <div class="label">Battery Power</div>
            <div class="value">${fmt(d.battery_power_w, 0)}</div>
            <div class="unit">W</div>
          </div>
          <div class="card">
            <div class="label">Electricity Price</div>
            <div class="value ${d.is_cheap_rate ? 'cheap' : 'expensive'}">${fmt(d.electricity_price_eur, 4)}</div>
            <div class="unit">€/kWh ${d.is_cheap_rate ? '&#10003; cheap' : ''}</div>
          </div>
        </div>

        <p class="section-title">Cost &amp; Savings</p>
        <div class="savings-grid">
          <div class="savings-card">
            <div class="slabel">Saved Today (PV)</div>
            <div class="svalue">€${fmt(d.today_pv_saved_eur, 4)}</div>
          </div>
          <div class="savings-card">
            <div class="slabel">Grid Cost Today</div>
            <div class="svalue negative">€${fmt(d.today_grid_cost_eur, 4)}</div>
          </div>
          <div class="savings-card">
            <div class="slabel">PV Used Today</div>
            <div class="svalue">${fmt(d.today_pv_used_kwh, 3)} kWh</div>
          </div>
          <div class="savings-card">
            <div class="slabel">Grid Import Today</div>
            <div class="svalue muted">${fmt(d.today_grid_import_kwh, 3)} kWh</div>
          </div>
          <div class="savings-card">
            <div class="slabel">Saved This Week</div>
            <div class="svalue">€${fmt(d.week_pv_saved_eur, 4)}</div>
          </div>
          <div class="savings-card">
            <div class="slabel">Grid Cost This Week</div>
            <div class="svalue negative">€${fmt(d.week_grid_cost_eur, 4)}</div>
          </div>
        </div>

        ${(d.predicted_load_kwh !== undefined || d.predicted_pv_kwh !== undefined) ? `
        <p class="section-title">Forecast &amp; Prediction
          ${d.prediction_confidence ? '<span class="conf-badge conf-' + d.prediction_confidence + '">' + d.prediction_confidence + '</span>' : ''}
        </p>
        <div class="savings-grid">
          <div class="savings-card">
            <div class="slabel">Predicted Load</div>
            <div class="svalue muted">${fmt(d.predicted_load_kwh, 2)} kWh</div>
          </div>
          <div class="savings-card">
            <div class="slabel">Predicted PV Yield</div>
            <div class="svalue">${fmt(d.predicted_pv_kwh, 2)} kWh</div>
          </div>
        </div>` : ''}
      `;
    }

    setInterval(refresh, 5000);
    window.onload = refresh;
  </script>
</body>
</html>
